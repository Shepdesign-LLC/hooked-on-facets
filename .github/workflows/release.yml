name: Release

# Builds the distributable plugin ZIP and publishes a GitHub Release.
#
# Fires automatically when the plugin version changes on main, and can be
# run on demand from the Actions tab (or via API). It no-ops if a release
# for the current version already exists, so it is safe to re-run.
#
# Packaging is delegated to bin/build-release.sh — the same Docker-driven
# build used for manual releases — so the CI artifact can never drift from
# the canonical package. The version is read from the plugin header, the
# script's single source of truth (it enforces header == HOF_VERSION and
# self-verifies the ZIP contents, including admin/ and public/, which the
# workflow's old inline copy list omitted).

on:
  push:
    branches: [main]
    paths: ['hooked-on-facets.php']
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to hand the published release to the WordPress.org deploy

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from the plugin header
        id: v
        run: |
          VERSION="$(grep -E '^[[:space:]]*\*?[[:space:]]*Version:' hooked-on-facets.php | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]\r')"
          if [ -z "$VERSION" ]; then
            echo "Could not read the Version header from hooked-on-facets.php" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.v.outputs.version }} already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release ZIP
        if: steps.exists.outputs.skip == 'false'
        run: bash bin/build-release.sh

      - name: Create GitHub Release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          # A SemVer pre-release (1.2.0-beta, 0.13.1-alpha) must not become "Latest".
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          # Notes come from this version's CHANGELOG.md section; GitHub's
          # generated PR list is the fallback when the changelog has none.
          if bash bin/release-notes.sh "$VERSION" > release-notes.md; then
            NOTES=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG.md section for $VERSION; using generated notes."
            NOTES=(--generate-notes)
          fi
          gh release create "v$VERSION" "dist/hooked-on-facets-$VERSION.zip" \
            --target "${{ github.sha }}" \
            --title "Hooked on Facets $VERSION" \
            "${NOTES[@]}" $PRERELEASE

      - name: Hand off to the WordPress.org deploy
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created with GITHUB_TOKEN never fires other workflows'
          # `release` triggers; workflow_dispatch is exempt from that rule, so
          # start the deploy explicitly on the new tag. It skips pre-releases
          # and no-ops without SVN credentials.
          gh workflow run wporg-deploy.yml --ref "v${{ steps.v.outputs.version }}"
